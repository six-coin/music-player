<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>音乐库管理器</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    // 首帧前先把主题定下来，避免深色模式下先白一下。
    (function () {
      try {
        var saved = window.localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.dataset.theme = saved;
        } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (error) {
        /* localStorage 不可用时按浅色处理 */
      }
    })();
  </script>
</head>
<body>
  <div class="app" id="app">
    <nav class="rail" aria-label="主导航">
      <div class="rail-brand" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>

      <button class="rail-item is-active" data-section="overview">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
        <span data-i18n="nav.overview">概览</span>
      </button>

      <button class="rail-item" data-section="songs">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
        <span data-i18n="nav.songs">歌曲</span>
      </button>

      <button class="rail-item" data-section="playlists">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
        </svg>
        <span data-i18n="nav.playlists">歌单</span>
      </button>

      <button class="rail-item" data-section="tags">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.59 13.41 12 22 2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82Z"/>
          <circle cx="7" cy="7" r="1.5"/>
        </svg>
        <span data-i18n="nav.tags">标签</span>
      </button>

      <button class="rail-item" data-section="authors">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span data-i18n="nav.authors">作者</span>
      </button>

      <div class="rail-spacer"></div>

      <button class="rail-item" data-section="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
        </svg>
        <span data-i18n="nav.settings">设置</span>
      </button>
    </nav>

    <main class="main" id="main">
      <section class="view" data-view="overview">
        <header class="page-head">
          <div class="page-title">
            <h1 data-i18n="overview.title">音乐库</h1>
            <p class="page-sub" id="summary"></p>
          </div>
          <div class="page-actions">
            <button class="btn primary" data-action="import" data-i18n="action.import_music">导入音乐</button>
          </div>
        </header>

        <div class="stats" id="stats">
          <button class="stat" data-target="songs">
            <span class="stat-value" data-stat="musics">0</span>
            <span class="stat-label" data-i18n="overview.stat_songs">歌曲</span>
          </button>
          <button class="stat" data-target="songs">
            <span class="stat-value" data-stat="duration">0:00</span>
            <span class="stat-label" data-i18n="overview.stat_duration">总时长</span>
          </button>
          <button class="stat" data-target="songs">
            <span class="stat-value" data-stat="size">0 B</span>
            <span class="stat-label" data-i18n="overview.stat_size">占用</span>
          </button>
          <button class="stat" data-target="playlists">
            <span class="stat-value" data-stat="playlists">0</span>
            <span class="stat-label" data-i18n="overview.stat_playlists">歌单</span>
          </button>
          <button class="stat" data-target="authors">
            <span class="stat-value" data-stat="authors">0</span>
            <span class="stat-label" data-i18n="overview.stat_authors">作者</span>
          </button>
          <button class="stat" data-target="tags">
            <span class="stat-value" data-stat="tag_groups">0</span>
            <span class="stat-label" data-i18n="overview.stat_tags">标签组</span>
          </button>
        </div>

        <div class="empty" id="overview-empty" hidden>
          <svg class="empty-art" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
          <h2 data-i18n="empty.library_title">库里还没有歌</h2>
          <p data-i18n="empty.library_hint">导入音乐后，这里会显示歌曲、歌单与标签的概况。</p>
          <button class="btn primary" data-action="import" data-i18n="action.import_first">导入第一首歌</button>
        </div>

        <div class="columns" id="overview-columns">
          <section class="card">
            <div class="card-head">
              <div class="tabs" role="tablist">
                <button class="tab is-active" data-tab="imported" role="tab">
                  <span data-i18n="overview.recent_imported">最近导入</span>
                </button>
                <button class="tab" data-tab="edited" role="tab">
                  <span data-i18n="overview.recent_edited">最近编辑</span>
                </button>
              </div>
            </div>
            <ul class="rows" id="recent"></ul>
          </section>

          <section class="card">
            <div class="card-head">
              <h2 class="card-title" data-i18n="overview.issues">待处理</h2>
            </div>
            <ul class="rows" id="issues"></ul>
          </section>
        </div>

        <div class="quick" id="quick">
          <button class="btn ghost" data-action="launch_player" data-i18n="action.open_player">打开音乐播放器</button>
          <button class="btn ghost" data-action="launch_simple" data-i18n="action.open_simple">打开轻量音乐播放器</button>
          <button class="btn ghost" data-action="import" data-i18n="action.import_music">导入音乐</button>
          <button class="btn ghost" data-action="data_dir" data-i18n="action.open_data_dir">打开数据目录</button>
          <button class="btn ghost" data-action="integrity" data-i18n="action.integrity">完整性检查</button>
          <button class="btn ghost" data-action="settings" data-i18n="action.settings">设置</button>
        </div>
      </section>

      <section class="view view--split is-hidden" data-view="songs">
        <aside class="list-pane">
          <header class="pane-head">
            <div class="pane-title">
              <h2 data-i18n="nav.songs">歌曲</h2>
              <p class="pane-sub" id="songs-count"></p>
            </div>
            <button class="btn primary" data-action="import" data-i18n="action.import">导入</button>
          </header>

          <div class="search">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7"/>
              <path d="m20 20-3.5-3.5"/>
            </svg>
            <input id="songs-search" type="search" data-i18n-placeholder="songs.search" autocomplete="off">
            <button class="search-clear" id="songs-search-clear" type="button" aria-label="清除" hidden>×</button>
          </div>

          <div class="list-tools">
            <label class="check">
              <input type="checkbox" id="songs-select-all">
              <span data-i18n="action.select_all">全选</span>
            </label>
            <div class="select small" id="songs-sort" role="combobox" tabindex="0"
                 aria-expanded="false" aria-haspopup="listbox" data-value="title">
              <span class="select-value"></span>
              <svg class="select-arrow" viewBox="0 0 12 12" aria-hidden="true">
                <path d="M2.5 4.5L6 8l3.5-3.5"/>
              </svg>
              <div class="select-menu" role="listbox"></div>
            </div>
          </div>

          <ul class="song-list" id="song-list"></ul>

          <div class="selection-bar is-hidden" id="selection-bar">
            <span class="selection-count" id="selection-count"></span>
            <div class="selection-actions">
              <button class="btn soft" data-batch="tags" data-i18n="action.batch_tags">加标签</button>
              <button class="btn soft" data-batch="playlist" data-i18n="action.batch_playlist">加入歌单</button>
              <button class="btn ghost" data-batch="clear" data-i18n="action.clear">取消选择</button>
              <button class="btn danger-ghost" data-batch="delete" data-i18n="song.delete">删除歌曲</button>
            </div>
          </div>
        </aside>

        <section class="detail-pane" id="song-detail"></section>
      </section>

      <section class="view view--split is-hidden" data-view="playlists">
        <aside class="list-pane">
          <header class="pane-head">
            <div class="pane-title">
              <h2 data-i18n="nav.playlists">歌单</h2>
              <p class="pane-sub" id="playlists-count"></p>
            </div>
            <button class="btn primary" id="btn-new-playlist" data-i18n="playlist.new">新建</button>
          </header>

          <div class="search">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7"/>
              <path d="m20 20-3.5-3.5"/>
            </svg>
            <input id="playlists-search" type="search" data-i18n-placeholder="playlist.search" autocomplete="off">
            <button class="search-clear" id="playlists-search-clear" type="button" aria-label="清除" hidden>×</button>
          </div>

          <ul class="song-list" id="playlist-list"></ul>
        </aside>

        <section class="detail-pane" id="playlist-detail"></section>
      </section>

      <section class="view view--split is-hidden" data-view="tags">
        <aside class="list-pane">
          <header class="pane-head">
            <div class="pane-title">
              <h2 data-i18n="nav.tags">标签</h2>
              <p class="pane-sub" id="tags-count"></p>
            </div>
            <button class="btn primary" id="btn-new-tag-group" data-i18n="tag.new_group">新建</button>
          </header>

          <div class="search">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7"/>
              <path d="m20 20-3.5-3.5"/>
            </svg>
            <input id="tags-search" type="search" data-i18n-placeholder="tag.search" autocomplete="off">
            <button class="search-clear" id="tags-search-clear" type="button" aria-label="清除" hidden>×</button>
          </div>

          <ul class="song-list" id="tag-list"></ul>
        </aside>

        <section class="detail-pane" id="tag-detail"></section>
      </section>

      <section class="view view--split is-hidden" data-view="authors">
        <aside class="list-pane">
          <header class="pane-head">
            <div class="pane-title">
              <h2 data-i18n="nav.authors">作者</h2>
              <p class="pane-sub" id="authors-count"></p>
            </div>
            <button class="btn primary" id="btn-new-author" data-i18n="author.new">新建</button>
          </header>

          <div class="search">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7"/>
              <path d="m20 20-3.5-3.5"/>
            </svg>
            <input id="authors-search" type="search" data-i18n-placeholder="author.search" autocomplete="off">
            <button class="search-clear" id="authors-search-clear" type="button" aria-label="清除" hidden>×</button>
          </div>

          <div class="list-tools" id="author-tools" hidden>
            <span class="pane-sub" id="author-empty-count"></span>
            <button class="btn ghost small" data-action="clean_authors" data-i18n="author.clean">清理空作者</button>
          </div>

          <ul class="song-list" id="author-list"></ul>
        </aside>

        <section class="detail-pane" id="author-detail"></section>
      </section>

      <section class="view is-hidden" data-view="settings">
        <header class="page-head">
          <div class="page-title">
            <h1 data-i18n="nav.settings">设置</h1>
            <p class="page-sub" data-i18n="settings.sub">改完即生效，没有保存按钮。</p>
          </div>
        </header>

        <div class="settings">
          <nav class="settings-nav" id="settings-nav" aria-label="设置分页">
            <button class="settings-tab is-active" data-settings="general" data-i18n="settings.general">通用</button>
            <button class="settings-tab" data-settings="simple" data-i18n="settings.simple">轻量音乐播放器</button>
            <button class="settings-tab" data-settings="player" data-i18n="settings.player">音乐播放器</button>
            <button class="settings-tab" data-settings="import" data-i18n="settings.import">导入</button>
            <button class="settings-tab" data-settings="maintenance" data-i18n="settings.maintenance">维护</button>
          </nav>
          <div class="settings-body" id="settings-body"></div>
        </div>
      </section>

      <section class="view is-hidden" data-view="pending">
        <div class="empty">
          <svg class="empty-art" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v18M3 12h18"/>
          </svg>
          <h2 id="pending-title" data-i18n="section.pending_title">这个分区还在建设中</h2>
          <p data-i18n="section.pending_hint">当前阶段完成了概览与数据层，其余分区会在后续阶段补齐。</p>
        </div>
      </section>
    </main>
  </div>

  <div class="audition" id="audition" hidden>
    <audio id="audition-audio" preload="auto"></audio>
    <div class="audition-title" id="audition-title"></div>
    <button class="icon-btn audition-toggle" id="audition-toggle" type="button" data-playing="false" aria-label="播放">
      <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></svg>
    </button>
    <span class="audition-time" id="audition-current">0:00</span>
    <input class="range audition-seek" id="audition-seek" type="range" min="0" max="1000" value="0" aria-label="进度">
    <span class="audition-time" id="audition-total">0:00</span>
    <div class="audition-volume">
      <svg class="audition-vol-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9.5h3.5L12 6v12L7.5 14.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/>
      </svg>
      <input class="range audition-vol" id="audition-volume" type="range" min="0" max="100" step="1" value="5" aria-label="试听音量">
      <span class="audition-time" id="audition-volume-value">5%</span>
    </div>
    <button class="icon-btn" id="audition-close" type="button" aria-label="关闭">×</button>
  </div>

  <aside class="drawer" id="drawer" role="dialog" aria-modal="false" hidden>
    <header class="drawer-head">
      <h2 id="drawer-title"></h2>
      <button class="icon-btn" id="drawer-close" type="button" aria-label="关闭">×</button>
    </header>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div class="menu" id="menu" role="menu" hidden></div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" id="modal-card" role="dialog" aria-modal="true" tabindex="-1">
      <header class="modal-head">
        <h2 id="modal-title"></h2>
        <button class="icon-btn" id="modal-close" type="button" aria-label="关闭">×</button>
      </header>
      <div class="modal-body" id="modal-body"></div>
      <footer class="modal-actions" id="modal-actions"></footer>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <!-- 没有构建步骤：按职责拆成多个普通脚本，共享全局作用域，顺序见 docs/architecture.md -->
  <script src="js/core.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/ui-widgets.js"></script>
  <script src="js/render-overview.js"></script>
  <script src="js/render-songs.js"></script>
  <script src="js/render-playlists.js"></script>
  <script src="js/render-library.js"></script>
  <script src="js/render-settings.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/integrity.js"></script>
  <script src="js/import.js"></script>
  <script src="js/actions-library.js"></script>
  <script src="js/actions-songs.js"></script>
  <script src="js/events-shell.js"></script>
  <script src="js/events-playlists.js"></script>
  <script src="js/events-library.js"></script>
  <script src="js/events-panels.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
