[project]
name = "music-player"
version = "1.0.0.dev4"
description = "A local music library manager plus two players: the manager imports, organizes and configures; the players only play. Windows desktop app, double-click to run."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7",
    "python-vlc>=3.0",
    "pywebview>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = []

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
